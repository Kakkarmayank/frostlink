[project]
name = "frostlink"
version = "0.1.0"
description = "FrostLink: one-liner Snowflake → Pandas or PySpark (SSO ready)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas",
  "snowflake-connector-python",
]

[project.optional-dependencies]
spark = ["pyspark>=3.4"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
